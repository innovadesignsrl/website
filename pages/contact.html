<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto - INNOVA DESIGN</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="icon" type="image/x-icon" href="../img/favicon.ico">
</head>
<body>
  <header class="hero">
    <img src="../img/logo.png" alt="INNOVA DESIGN Logo" class="logo">
    <h1>Contáctanos</h1>
  </header>

  <div>
      <nav class="navbar">
        <input type="checkbox" id="menu-toggle" />
        <label for="menu-toggle" class="menu-icon">&#9776;</label>
        <ul class="nav-links">
          <li><a href="../index.html">Inicio</a></li>
          <li><a href="aboutus.html">Sobre nosotros</a></li>
          <li><a href="services.html">Servicios</a></li>
          <li><a href="contact.html">Contacto</a></li>
        </ul>
      </nav>
  </div>

  <main class="main-content">
    <section>
      <h2>Formulario de Contacto</h2>
      <form action="https://formsubmit.co/id.highleveldesign@gmail.com" method="POST" class="contact-form"/>
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre" required>

        <label for="correo">Correo Electrónico:</label>
        <input type="email" id="correo" name="correo" required>

        <label for="mensaje">Mensaje:</label>
        <textarea id="mensaje" name="mensaje" rows="5" required></textarea>

        <button type="submit" class="btn">Enviar</button>
      </form>
    </section>
      <div class="social-links">
        <a href="https://www.instagram.com/innova.design._" target="_blank"><i class="fab fa-instagram"></i></a>
      </div>
  </main>


  <footer>
    <p>&copy; 2025 INNOVA DESIGN - Todos los derechos reservados.</p>
  </footer>
</body>
</html>
